name: Release

# Cross-compiles the connector for every supported target and publishes the
# binaries as GitHub Release assets. Triggered by pushing a version tag, e.g.:
#
#   git tag v0.2.0 && git push origin v0.2.0
#
# Build parameters match the binaries currently shipped from the repo root
# (verified via `go version -m`): static (CGO disabled), stripped, and — for the
# Creality K1/K1 Max — mipsle + hardfloat. Changing GOMIPS to softfloat would
# produce a binary that does not run on the K1, so leave it as hardfloat unless
# validated on real hardware.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: cross-compile · publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: "1.23"

      - name: Cross-compile connector binaries
        env:
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist
          version="${GITHUB_REF_NAME}"
          ldflags="-s -w -X main.version=${version#v}"
          echo "Building ${version}"

          GOOS=linux GOARCH=arm64 \
            go build -trimpath -ldflags "$ldflags" -o dist/printer-connector-arm64 ./cmd/connector
          GOOS=linux GOARCH=amd64 \
            go build -trimpath -ldflags "$ldflags" -o dist/printer-connector-amd64 ./cmd/connector
          GOOS=linux GOARCH=mipsle GOMIPS=hardfloat \
            go build -trimpath -ldflags "$ldflags" -o dist/printer-connector-mips ./cmd/connector

          # Desktop targets — the SpoolrConnect app (and its "Check for updates"
          # button) runs on macOS; also ship Windows. CGO disabled, so these
          # cross-compile cleanly on the Linux runner.
          GOOS=darwin GOARCH=arm64 \
            go build -trimpath -ldflags "$ldflags" -o dist/printer-connector-darwin-arm64 ./cmd/connector
          GOOS=darwin GOARCH=amd64 \
            go build -trimpath -ldflags "$ldflags" -o dist/printer-connector-darwin-amd64 ./cmd/connector
          GOOS=windows GOARCH=amd64 \
            go build -trimpath -ldflags "$ldflags" -o dist/printer-connector-windows-amd64.exe ./cmd/connector

      - name: Generate checksums
        run: cd dist && sha256sum * > SHA256SUMS

      # Pull the matching "## [X.Y.Z]" section out of CHANGELOG.md so the
      # GitHub Release page shows the same notes as the changelog file. Only
      # this job sets the release body; the macOS/Windows jobs below attach
      # their assets without touching the body (action-gh-release is
      # idempotent — first call creates the release, later calls update it).
      - name: Extract changelog section for this tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v ver="$version" '
            /^## \[/ {
              if (capturing) exit
              if ($0 ~ ("\\[" ver "\\]")) capturing = 1
              next
            }
            capturing { print }
          ' CHANGELOG.md > dist/RELEASE_BODY.md
          if [ ! -s dist/RELEASE_BODY.md ]; then
            echo "WARNING: no [$version] section found in CHANGELOG.md — release body will be empty"
          fi

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          body_path: dist/RELEASE_BODY.md
          files: |
            dist/printer-connector-arm64
            dist/printer-connector-amd64
            dist/printer-connector-mips
            dist/printer-connector-darwin-arm64
            dist/printer-connector-darwin-amd64
            dist/printer-connector-windows-amd64.exe
            dist/SHA256SUMS

  # The Spoolr Connect menu-bar app: a universal (arm64 + x86_64), ad-hoc-signed
  # .app. NOT Developer-ID signed or notarized (no paid Apple account), so users
  # install via install-macos.sh (no quarantine) or clear quarantine manually —
  # see README "Installing on macOS". Needs a macOS runner for swift + codesign.
  build-macos-app:
    name: build · package menu-bar app
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: "1.23"

      - name: Build universal Spoolr Connect.app
        env:
          APP_VERSION: ${{ github.ref_name }}
        run: macos/SpoolrConnect/scripts/build_app.sh --universal

      - name: Zip the app (ditto preserves the bundle + ad-hoc signature)
        run: |
          cd macos/SpoolrConnect/dist
          ditto -c -k --keepParent "Spoolr Connect.app" "SpoolrConnect-macos.zip"
          shasum -a 256 SpoolrConnect-macos.zip

      - name: Publish app to the release
        uses: softprops/action-gh-release@v2
        with:
          files: macos/SpoolrConnect/dist/SpoolrConnect-macos.zip

  # Windows GUI installer: an Inno Setup–packaged .exe that collects the pairing
  # code, runs "register", and installs the connector as a Windows Service.
  # The binary is UNSIGNED (no Authenticode cert); SmartScreen will warn — users
  # dismiss it with "More info" → "Run anyway". See docs/INSTALL-Windows.md.
  build-windows-installer:
    name: build · Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: "1.23"

      - name: Build Windows connector binary
        env:
          CGO_ENABLED: "0"
          GOOS: windows
          GOARCH: amd64
        # Strip the leading 'v' from the tag for the Go version string.
        # GITHUB_REF_NAME is "v1.2.3"; we pass "1.2.3" to -X main.version.
        run: |
          $version = "${{ github.ref_name }}"
          $semver = $version.TrimStart('v')
          $ldflags = "-s -w -X main.version=$semver"
          go build -trimpath -ldflags "$ldflags" -o printer-connector.exe ./cmd/connector

      - name: Install Inno Setup 6
        run: choco install innosetup --yes --no-progress

      - name: Compile installer
        run: |
          $version = "${{ github.ref_name }}"
          $semver = $version.TrimStart('v')
          # ISCC.exe is installed by Chocolatey into Program Files (x86)\Inno Setup 6.
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" `
            /DAppVersion=$semver `
            windows\installer.iss
          # Verify the output file was created.
          if (-not (Test-Path "windows\Output\SpoolrConnect-Setup.exe")) {
            Write-Error "Installer was not produced — ISCC may have failed."
            exit 1
          }

      - name: Publish installer to the release
        uses: softprops/action-gh-release@v2
        with:
          files: windows/Output/SpoolrConnect-Setup.exe
