name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: build · vet · test · fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: "1.22"
          cache: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::The following files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: go test
        run: go test -race ./...

  # The macOS menu-bar app (macos/SpoolrConnect) isn't covered by the Go job —
  # build + test it so the Swift side can't regress silently on a PR.
  macos-app:
    name: swift build · test
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5

      - name: swift build + test
        run: |
          cd macos/SpoolrConnect
          swift build
          swift test
