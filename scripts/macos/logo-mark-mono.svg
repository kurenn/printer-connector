<?xml version="1.0"?>
<!-- Spoolr compact mark (ring + dot), monochrome for a macOS menu-bar template
     icon. Black on transparent; macOS tints it for light/dark. ~80% size via the
     padded viewBox so it sits comfortably in the menu bar. Source: Spoolr Brand
     Kit › logo-mark-compact.svg. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-8 -8 80 80" width="80" height="80" fill="none">
  <circle cx="32" cy="32" r="27" stroke="#000000" stroke-width="5"></circle>
  <circle cx="32" cy="32" r="10" fill="#000000"></circle>
</svg>
